server {
    listen 80;
    server_name _;

    # Raiz do Laravel
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20m;

    # SPA (React buildado em public/) e API do Laravel.
    # Qualquer rota que não seja um arquivo físico cai no index.php,
    # que serve o SPA ou delega ao roteador do Laravel (/api/*).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ \.php$ {
        return 404;
    }

    # Arquivos estáticos com cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}